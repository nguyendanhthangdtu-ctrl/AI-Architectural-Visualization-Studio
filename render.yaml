# BUILD 32B (Frontend Production Deployment & API Connection) — best-effort
# Render Blueprint. NOT validated against a real Render account (no Render
# access exists in the environment this was authored in) — Render's "New
# Blueprint" flow will show a clear validation error if any field name has
# drifted from Render's current schema. If it doesn't apply cleanly, update
# your existing service's dashboard settings manually instead — see
# docs/BUILD_32B_RENDER_FRONTEND.md for the exact same values written out
# as manual steps (the reliable, guaranteed-current path), including how to
# update the service that's already live rather than creating a new one.
#
# CORRECTED from BUILD 32A: ONE service, not two. apps/web is now built and
# served SAME-ORIGIN from apps/api itself (apps/api/src/static-assets.ts) —
# not a separate Render Static Site. This isn't a style choice: the session
# cookie is `SameSite=Strict` (apps/api/src/auth/session.ts), and Render
# deliberately lists `onrender.com` in the Public Suffix List (the same
# reason `github.io`/`vercel.app` are listed) — two different
# `*.onrender.com` subdomains are different "sites" under that list, so a
# browser would never send that cookie between them. A single service is
# the only free-tier-only way (no custom domain) to keep auth working.
#
# Genuinely free: one Render Web Service, no paid disk/DB/worker/queue.

services:
  - type: web
    name: ai-architectural-visualization-studio
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.5.0
      # Render injects PORT itself — parseServerEnv() already falls back to
      # it (packages/shared/src/env.ts), nothing to set here for that.
      - key: WEB_DIST_DIR
        value: apps/web/dist # serves the built frontend same-origin — see static-assets.ts
      #
      # Every value below is a real secret or deployment-specific value —
      # `sync: false` means Render will prompt for it once in the
      # dashboard and never store/sync it through this file. Never fill in
      # a real value here, and never paste one into a chat with any AI
      # assistant, including this one.
      - key: DATABASE_URL
        sync: false # e.g. /opt/render/project/data/avs.sqlite3 — ephemeral on Render Free unless a paid persistent disk is attached; see the BUILD 32B report
      - key: ASSET_STORE_URL
        sync: false # e.g. /opt/render/project/data/assets — same ephemeral-storage caveat
      - key: REGISTRATION_SECRET
        sync: false
      - key: ASSET_URL_SIGNING_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false # same-origin deployment doesn't need this for the frontend itself; only set it if a genuinely different origin also needs to call this API
      - key: TRUST_HTTPS
        value: 'true' # Render terminates TLS in front of this service
      - key: GEMINI_API_KEY
        sync: false # optional — BUILD 29's quota remains blocked regardless of whether this is set
      - key: NANO_BANANA_API_KEY
        sync: false # optional
      - key: CHATGPT_IMAGE_API_KEY
        sync: false # optional
